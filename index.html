<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findora | Trending Finds & Gadgets</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --amazon: #ff9900;
      --flipkart: #2874f0;
      --meesho: #ec4899;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 16px 60px;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }
    .brand {
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      color: var(--muted);
      margin-top: 6px;
      font-size: 15px;
    }
    .admin-trigger {
      margin-top: 15px;
      display: inline-block;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .target-highlight {
      border-color: var(--accent) !important;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6) !important;
    }
    .card-img-wrap {
      width: 100%;
      height: 200px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      width: fit-content;
      margin-bottom: 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-amazon { background-color: var(--amazon); color: #000; }
    .btn-flipkart { background-color: var(--flipkart); color: #fff; }
    .btn-meesho { background-color: var(--meesho); color: #fff; }
    .card-admin-actions {
      display: none;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 6px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    /* Modal / Admin Panel */
    .admin-panel {
      display: none;
      background: #111827;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 30px;
    }
    .admin-panel h3 { margin-bottom: 15px; font-size: 18px; color: var(--accent); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1f2937;
      color: #fff;
      font-size: 13px;
    }
    .admin-btn-row { display: flex; gap: 10px; }
    .btn-submit {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">Findora</div>
      <p class="tagline">Trending Finds, Smart Tech & Lifestyle Picks</p>
      <div class="admin-trigger" id="adminTriggerBtn" onclick="openAdminAuth()">⚙️ Manage Products</div>
    </header>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
      <h3>Add New Product to Findora</h3>
      <div class="form-grid">
        <div class="form-group"><input type="text" id="pId" placeholder="Unique ID (e.g. smart-watch)"></div>
        <div class="form-group"><input type="text" id="pTitle" placeholder="Product Title"></div>
        <div class="form-group"><input type="text" id="pCategory" placeholder="Category (e.g. Tech)"></div>
        <div class="form-group">
          <select id="pStore">
            <option value="amazon">Amazon</option>
            <option value="flipkart">Flipkart</option>
            <option value="meesho">Meesho</option>
          </select>
        </div>
        <div class="form-group"><input type="url" id="pImage" placeholder="Image URL (Direct https link)"></div>
        <div class="form-group"><input type="url" id="pLink" placeholder="Your Affiliate Link"></div>
      </div>
      <div class="form-group" style="margin-bottom: 15px;">
        <textarea id="pDesc" rows="2" placeholder="Short description..."></textarea>
      </div>
      <div class="admin-btn-row">
        <button class="btn-submit" onclick="addProduct()">Save & Publish to GitHub</button>
        <button class="btn-submit" style="background:#4b5563; color:#fff;" onclick="logoutAdmin()">Close Admin</button>
      </div>
    </div>

    <div class="grid" id="productGrid">
      <!-- Loaded dynamically via JSON -->
    </div>

    <footer>
      <p>Disclosure: Findora participates in affiliate marketing programs. We may earn a small referral commission for qualifying purchases made via our links, at no extra cost to you.</p>
    </footer>
  </div>

  <script>
    const GITHUB_USERNAME = "soma9792";
    const GITHUB_REPO = "findora";
    const FILE_PATH = "products.json";

    let products = [];
    let fileSha = "";
    let isAdmin = false;

    // Fetch products on page load
    async function fetchProducts() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${FILE_PATH}?nocache=${new Date().getTime()}`);
        products = await res.json();
        renderProducts();
        handleAnchorScroll();
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      products.forEach((p, idx) => {
        let storeBtn = "";
        if (p.store === "amazon") storeBtn = `<a href="${p.link}" target="_blank" rel="nofollow noopener" class="btn btn-amazon">Shop on Amazon</a>`;
        else if (p.store === "flipkart") storeBtn = `<a href="${p.link}" target="_blank" rel="nofollow noopener" class="btn btn-flipkart">Shop on Flipkart</a>`;
        else storeBtn = `<a href="${p.link}" target="_blank" rel="nofollow noopener" class="btn btn-meesho">Shop on Meesho</a>`;

        const card = document.createElement("div");
        card.className = "card";
        card.id = p.id;
        card.innerHTML = `
          <div class="card-img-wrap"><img src="${p.image}" alt="${p.title}"></div>
          <span class="badge">${p.category}</span>
          <h2 class="card-title">${p.title}</h2>
          <p class="card-desc">${p.desc}</p>
          ${storeBtn}
          <div class="card-admin-actions" id="adminAction_${idx}">
            <button class="btn-delete" onclick="deleteProduct(${idx})">🗑 Delete Product</button>
          </div>
        `;
        grid.appendChild(card);
      });

      if (isAdmin) toggleAdminUI(true);
    }

    function handleAnchorScroll() {
      const hash = window.location.hash;
      if (hash) {
        const target = document.querySelector(hash);
        if (target) {
          setTimeout(() => {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('target-highlight');
          }, 300);
        }
      }
    }

    // Admin Auth
    function openAdminAuth() {
      if (isAdmin) {
        document.getElementById("adminPanel").style.display = "block";
        return;
      }
      const token = prompt("Enter your GitHub Access Token (PAT):");
      if (!token) return;
      sessionStorage.setItem("gh_pat", token);
      isAdmin = true;
      toggleAdminUI(true);
      document.getElementById("adminPanel").style.display = "block";
    }

    function toggleAdminUI(show) {
      document.querySelectorAll(".card-admin-actions").forEach(el => el.style.display = show ? "block" : "none");
    }

    function logoutAdmin() {
      sessionStorage.removeItem("gh_pat");
      isAdmin = false;
      toggleAdminUI(false);
      document.getElementById("adminPanel").style.display = "none";
    }

    // Add Product & Push to GitHub via API
    async function addProduct() {
      const pat = sessionStorage.getItem("gh_pat");
      if (!pat) { alert("Missing token!"); return; }

      const id = document.getElementById("pId").value.trim().toLowerCase().replace(/\s+/g, '-');
      const title = document.getElementById("pTitle").value.trim();
      const category = document.getElementById("pCategory").value.trim();
      const store = document.getElementById("pStore").value;
      const image = document.getElementById("pImage").value.trim();
      const link = document.getElementById("pLink").value.trim();
      const desc = document.getElementById("pDesc").value.trim();

      if (!id || !title || !link || !image) {
        alert("Please fill in ID, Title, Image and Link.");
        return;
      }

      const newProduct = { id, title, desc, category, store, image, link };
      products.push(newProduct);

      await saveToGitHub("Add new product: " + title);
    }

    async function deleteProduct(index) {
      if (!confirm("Are you sure you want to delete this product?")) return;
      products.splice(index, 1);
      await saveToGitHub("Delete product");
    }

    async function saveToGitHub(commitMsg) {
      const pat = sessionStorage.getItem("gh_pat");
      const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`;

      try {
        // Step 1: Get current SHA
        const getRes = await fetch(url, { headers: { Authorization: `token ${pat}` } });
        const getData = await getRes.json();
        const currentSha = getData.sha;

        // Step 2: Upload updated JSON
        const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
        const putRes = await fetch(url, {
          method: "PUT",
          headers: {
            Authorization: `token ${pat}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: commitMsg,
            content: updatedContent,
            sha: currentSha
          })
        });

        if (putRes.ok) {
          alert("Success! Changes are updated in GitHub.");
          renderProducts();
          // Reset inputs
          document.getElementById("pId").value = "";
          document.getElementById("pTitle").value = "";
          document.getElementById("pImage").value = "";
          document.getElementById("pLink").value = "";
          document.getElementById("pDesc").value = "";
        } else {
          const err = await putRes.json();
          alert("Failed to save: " + err.message);
        }
      } catch (e) {
        console.error(e);
        alert("Network error while updating.");
      }
    }

    fetchProducts();
  </script>
</body>
</html>
